name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            system: x86_64-linux
          - os: ubuntu-24.04-arm
            system: aarch64-linux
          # macos-15-intel is the last x86_64 image Actions will offer
          # (available until August 2027); macos-13 was retired 2025-12-08.
          - os: macos-15-intel
            system: x86_64-darwin
          - os: macos-15
            system: aarch64-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # The Determinate installer refuses to run on Intel macOS and only
      # limps along by auto-pinning itself to its last Intel-capable
      # release, so that one system uses the classic installer instead.
      - uses: DeterminateSystems/nix-installer-action@main
        if: matrix.system != 'x86_64-darwin'

      - uses: cachix/install-nix-action@v31
        if: matrix.system == 'x86_64-darwin'
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v15
        with:
          name: rtk
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - run: nix build .#default --print-build-logs

      - run: nix run .#default -- --version

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          # Determinate Nix enables lazy-trees, under which devenv's shell eval
          # walks into nixpkgs' minimal-bootstrap chain and dies on
          # "path '/nix/store/...-ldexpl.c' is not valid". Upstream Nix has no
          # such setting and the same `devenv test` passes there.
          extra-conf: lazy-trees = false
      - run: nix run nixpkgs#devenv -- test --override-dotfile
